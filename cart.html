<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">Cosmic Gadgets</a>
            <a href="cart.html" class="cart-button">
                Cart
                <span id="cart-count">2</span>
            </a>
        </nav>
    </header>

    <main>
        <h1>Your Shopping Cart</h1>
        <div id="cart-items-container">
            
            <div class="cart-item">
                <img src="images/product2.jpg" alt="Pixel Buds">
                <div class="cart-item-details">
                    <h3>Pixel Buds</h3>
                    <p class="cart-item-price">$179.00 x 1</p>
                </div>
                <button class="remove-btn">Remove</button>
            </div>

            <div class="cart-item">
                <img src="images/product3.jpg" alt="Chrono-Keyboard">
                <div class="cart-item-details">
                    <h3>Chrono-Keyboard</h3>
                    <p class="cart-item-price">$125.50 x 2</p>
                </div>
                <button class="remove-btn">Remove</button>
            </div>
            
        </div>
        
        <div id="cart-summary">
             <div id="total-price" class="total-price">Total: $430.00</div>
             <a href="index.html" class="home-button">Continue Shopping</a>
        </div>
    </main>
    
    </body>
</html>
