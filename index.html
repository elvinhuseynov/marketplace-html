<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Gadgets Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">Cosmic Gadgets</a>
            <a href="cart.html" class="cart-button">
                Cart
                <span id="cart-count">2</span>
            </a>
        </nav>
    </header>

    <main>
        <h1>Our Products</h1>
        <div id="product-container" class="product-grid">
            
            <div class="product-card">
                <img src="images/product1.jpg" alt="Galaxy Watch">
                <h2>Galaxy Watch</h2>
                <p class="description">A smart watch for a smarter life.</p>
                <p class="price">$299.99</p>
                <button class="add-to-cart-btn">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="images/product2.jpg" alt="Pixel Buds">
                <h2>Pixel Buds</h2>
                <p class="description">High-quality audio, anywhere you go.</p>
                <p class="price">$179.00</p>
                <button class="add-to-cart-btn">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="images/product3.jpg" alt="Chrono-Keyboard">
                <h2>Chrono-Keyboard</h2>
                <p class="description">Type through time with this keyboard.</p>
                <p class="price">$125.50</p>
                <button class="add-to-cart-btn">Add to Cart</button>
            </div>

        </div>
    </main>

    </body>
</html>
